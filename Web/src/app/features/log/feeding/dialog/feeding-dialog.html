<h2 mat-dialog-title>Dialog working with data</h2>
<mat-dialog-content>
  <mat-form-field>
    <input matInput [(ngModel)]="data.name">
  </mat-form-field>
  <p>{{data.name}}</p>
</mat-dialog-content>
<mat-dialog-actions>
  <button matButton (click)="onNoClick()">No Thanks</button>
  <button matButton [mat-dialog-close]="data.name" cdkFocusInitial>Ok</button>
</mat-dialog-actions>

<ng-template template-name="time">
  <div>
    <mat-label>Time</mat-label>
  </div>
  <div>
    <mat-form-field>
      <mat-label>Start Time</mat-label>
      <input matInput [matTimepicker]="startTime" [formField]="pumpForm.startTime">
      <mat-timepicker-toggle matIconSuffix [for]="startTime"/>
      <mat-timepicker #startTime/>
    </mat-form-field>
  </div>
  <div>
    <mat-form-field>
      <mat-label>End Time</mat-label>
      <input matInput [matTimepicker]="endTime" [formField]="pumpForm.endTime">
      <mat-timepicker-toggle matIconSuffix [for]="endTime"/>
      <mat-timepicker #endTime/>
    </mat-form-field>
  </div>
</ng-template>

<ng-template template-name="amount">
  <div>
    <mat-label>Left Amount (oz)</mat-label>
  </div>
  <mat-slider min="0" max="10" step=".5" showTickMarks discrete>
    <input matSliderThumb [formField]="pumpForm.leftAmount">
  </mat-slider>
  <div>
    <mat-label>Right Amount (oz)</mat-label>
  </div>
  <mat-slider min="0" max="10" step=".5" showTickMarks discrete>
    <input matSliderThumb [formField]="pumpForm.rightAmount">
  </mat-slider>
</ng-template>

<ng-template template-name="notes">
  <mat-form-field>
    <mat-label>Notes</mat-label>
    <input matInput [formField]="pumpForm.notes">
  </mat-form-field>
  <div>
    <mat-label>Quick Notes</mat-label>
    <mat-chip-listbox multiple (change)="onQuickNotesChange($event)" aria-label="Pump quick notes">
    @for ( note of quickNotes; track note.description ) {
      <mat-chip-option>{{ note.description }}</mat-chip-option>
    }
    </mat-chip-listbox>
  </div>
</ng-template>

<div class="tracker-dialog-header">
  <h2 mat-dialog-title>Pump Tracker</h2>
  <button matIconButton mat-dialog-close aria-label="Close dialog" type="button">
    <mat-icon>close</mat-icon>
  </button>
</div>
<div class="flex-1 flex flex-col tracker-dialog-body">
  <form>
    <mat-stepper #stepper>
      @for (step of allSteps; track step.name;) {
        <mat-step>
          <ng-container [ngTemplateOutlet]="step.templateRef"></ng-container>
        </mat-step>
      }
    </mat-stepper>
  </form>
  <mat-dialog-actions align="start">
    <button matButton (click)="goBack()" [disabled]="stepper.selectedIndex === 0" type="button">Back</button>
    <button matButton="tonal" (click)="goForward()" [disabled]="stepper.selectedIndex === stepper.steps.length-1" type="button">Next</button>
  </mat-dialog-actions>
</div>

<mat-dialog-actions>
  <button matButton mat-dialog-close type="button">Cancel</button>
  <button matButton="filled" (click)="onSave()" mat-dialog-close type="button">Save</button>
</mat-dialog-actions>

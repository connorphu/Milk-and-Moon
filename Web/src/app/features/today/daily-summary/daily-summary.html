<mat-card>
  <mat-card-header>
    <mat-card-title>Daily Summary</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <div>Feed: {{ feedData().bottles }} bottle(s), {{ feedData().breastFeeds }} breast feed(s)</div>
    <div>Diapers: {{ diaperData().length }} diaper change(s)</div>
    <div>Sleep: {{ sleepData().totalHours }} hour(s), {{ sleepData().totalMinutes }} minute(s)</div>
    <div>Pump: {{ pumpData().length }} session(s)</div>
  </mat-card-content>
</mat-card>

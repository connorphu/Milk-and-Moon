<div class="page">
  <header class="page-header">
    <h1>Milk and Moon</h1>
    <p>Today's overview</p>
  </header>

  <main class="page-content">
    @let r = data();
    @if (r.result === 'error') {
      <div>{{ r.error }}</div>
    } @else if (r.result === 'ok') {
      <app-daily-summary [data]="r.logs"></app-daily-summary>
      <app-timeline-list [data]="r.logs"></app-timeline-list>
    } @else {
      <mat-spinner></mat-spinner>
    }
  </main>

  <app-log-panel />
</div>
